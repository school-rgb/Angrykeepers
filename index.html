    <!-- JavaScript Navigation & Canvas Logic -->
    <script>
        const canvas = document.getElementById('char-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const charUrl = "https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/2963f7ee-bab7-4281-8575-56b95ce9d6e0__1_-removebg-preview.png";

        const thresholdVal = 238;
        const featherVal = 1;

        async function loadAndProcessImage() {
            let img = new Image();
            img.crossOrigin = "Anonymous";

            try {
                const response = await fetch(charUrl);
                const blob = await response.blob();
                const objectURL = URL.createObjectURL(blob);
                img.src = objectURL;
            } catch (err) {
                img.src = charUrl;
            }

            img.onload = () => {
                canvas.width = img.naturalWidth || 600;
                canvas.height = img.naturalHeight || 600;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                processOuterFloodFill();
            };
        }

        function processOuterFloodFill() {
            const w = canvas.width;
            const h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0;
            let tail = 0;

            function isBackgroundPixel(idx) {
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const a = data[idx + 3];

                if (a < 15) return true;
                return (r >= thresholdVal && g >= thresholdVal && b >= thresholdVal);
            }

            for (let x = 0; x < w; x++) {
                let idxTop = (0 * w + x) * 4;
                if (isBackgroundPixel(idxTop)) {
                    visited[0 * w + x] = 1;
                    queue[tail++] = 0 * w + x;
                }
                let idxBot = ((h - 1) * w + x) * 4;
                if (isBackgroundPixel(idxBot)) {
                    visited[(h - 1) * w + x] = 1;
                    queue[tail++] = (h - 1) * w + x;
                }
            }

            for (let y = 0; y < h; y++) {
                let idxLeft = (y * w + 0) * 4;
                if (!visited[y * w + 0] && isBackgroundPixel(idxLeft)) {
                    visited[y * w + 0] = 1;
                    queue[tail++] = y * w + 0;
                }
                let idxRight = (y * w + (w - 1)) * 4;
                if (!visited[y * w + (w - 1)] && isBackgroundPixel(idxRight)) {
                    visited[y * w + (w - 1)] = 1;
                    queue[tail++] = y * w + (w - 1);
                }
            }

            while (head < tail) {
                const pos = queue[head++];
                const cx = pos % w;
                const cy = Math.floor(pos / w);
                const pixelIdx = pos * 4;
                data[pixelIdx + 3] = 0;

                const neighbors = [
                    [cx + 1, cy],
                    [cx - 1, cy],
                    [cx, cy + 1],
                    [cx, cy - 1]
                ];

                for (let i = 0; i < 4; i++) {
                    const nx = neighbors[i][0];
                    const ny = neighbors[i][1];

                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const nPos = ny * w + nx;
                        if (!visited[nPos]) {
                            visited[nPos] = 1;
                            const nIdx = nPos * 4;
                            if (isBackgroundPixel(nIdx)) {
                                queue[tail++] = nPos;
                            }
                        }
                    }
                }
            }

            if (featherVal > 0) {
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const pos = y * w + x;
                        const idx = pos * 4;
                        if (data[idx + 3] > 0 && !visited[pos]) {
                            if (visited[pos - 1] || visited[pos + 1] || visited[pos - w] || visited[pos + w]) {
                                data[idx + 3] = Math.floor(data[idx + 3] * 0.4);
                            }
                        }
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        /* Smooth View Navigation Functions */
        function showHomeView() {
            const homeView = document.getElementById('home-view');
            const menuView = document.getElementById('menu-view');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            menuView.classList.remove('opacity-100');
            menuView.classList.add('opacity-0');
            
            setTimeout(() => {
                menuView.classList.add('hidden');
                menuView.classList.remove('flex');
                
                homeView.classList.remove('hidden');
                homeView.classList.add('flex');
                setTimeout(() => {
                    homeView.classList.remove('opacity-0');
                    homeView.classList.add('opacity-100');
                }, 10);
            }, 300);
        }

        function openMenu(initialTitle) {
            const homeView = document.getElementById('home-view');
            const menuView = document.getElementById('menu-view');

            if (initialTitle) {
                document.getElementById('menu-title').textContent = initialTitle;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });

            homeView.classList.remove('opacity-100');
            homeView.classList.add('opacity-0');

            setTimeout(() => {
                homeView.classList.add('hidden');
                homeView.classList.remove('flex');

                menuView.classList.remove('hidden');
                menuView.classList.add('flex');
                setTimeout(() => {
                    menuView.classList.remove('opacity-0');
                    menuView.classList.add('opacity-100');
                }, 10);
            }, 300);
        }

        function selectThing(name) {
            document.getElementById('menu-title').textContent = name;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = loadAndProcessImage;
    </script>
