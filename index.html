<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AngryKeepersHugeFont';
            src: url('batsy-bounce.regular.otf') format('opentype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/batsy-bounce.regular.otf') format('opentype'),
                 url('velocita.personal-use.otf') format('opentype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/velocita.personal-use.otf') format('opentype'),
                 url('squares-bold.regular.otf') format('opentype'),
                 url('dedicool.regular.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'AngryKeepersSmallFont';
            src: url('gnf.regular.ttf') format('truetype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/gnf.regular.ttf') format('truetype'),
                 url('gnf.regular.otf') format('opentype'),
                 url('dedicool.regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'AngryKeepersSmallFont', sans-serif;
        }

        .blocky-text {
            font-family: 'AngryKeepersHugeFont', 'Rubik Mono One', 'Impact', cursive, sans-serif;
            color: #ffffff;
            text-shadow: 0 8px 16px rgba(0, 0, 0, 0.85);
        }

        .small-custom-text {
            font-family: 'AngryKeepersSmallFont', sans-serif;
        }

        /* Clean Scrollbar */
        ::-webkit-scrollbar {
            display: none;
            width: 0px;
        }
        html, body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="w-full min-h-screen bg-black select-none relative overflow-x-hidden overflow-y-auto">

    <!-- Fixed Fullscreen Background Image -->
    <img id="bg-img" 
         src="https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/5819c412-68d6-4491-b872-0a52c97a3ef9.jpeg" 
         alt="Background" 
         class="fixed inset-0 w-full h-full object-cover z-0 -scale-y-100 pointer-events-none">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 inset-x-0 h-28 bg-gradient-to-b from-black/95 via-black/70 to-transparent z-40 flex items-start justify-between px-6 sm:px-12 md:px-16 lg:px-24 pt-4 pointer-events-auto">
        <div class="flex items-center gap-4 sm:gap-6">
            <span class="small-custom-text text-white text-base sm:text-lg font-bold tracking-wider uppercase drop-shadow">Links</span>
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Home Button -->
                <button onclick="showHomeView()" class="px-3 py-1.5 bg-red-600/90 hover:bg-red-500 text-white rounded-md text-xs sm:text-sm font-medium transition backdrop-blur-sm border border-red-400/40 shadow-lg flex items-center gap-1.5 cursor-pointer">
                    Home
                </button>

                <!-- Proxy Mirrors Button with Updated PNG Icon -->
                <button onclick="openMenu(' LINKS')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-md text-xs sm:text-sm font-medium transition backdrop-blur-sm border border-white/20 flex items-center gap-1.5 cursor-pointer">
                    <img src="https://img.icons8.com/?size=100&id=PUtwHEklyzwP&format=png&color=FFFFFF" alt="Chain Icon" class="w-4 h-4 object-contain">
                     links
                </button>

                <!-- Unblocker Hub Button with Updated PNG Icon -->
                <button onclick="openMenu('GAMES HUB')" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-md text-xs sm:text-sm font-medium transition backdrop-blur-sm border border-white/20 flex items-center gap-1.5 cursor-pointer">
                    <img src="https://img.icons8.com/?size=100&id=PUtwHEklyzwP&format=png&color=FFFFFF" alt="Chain Icon" class="w-4 h-4 object-contain">
                    Games Hub
                </button>
            </div>
        </div>
    </header>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-red-600 text-white px-4 py-2 rounded-lg text-sm shadow-xl z-50 opacity-0 transition-opacity duration-300 pointer-events-none font-medium">
        Link copied to clipboard!
    </div>

    <!-- HOME VIEW -->
    <main id="home-view" class="min-h-screen w-full relative z-20 flex flex-row items-center justify-between px-6 sm:px-12 md:px-16 lg:px-24 transition-all duration-300 opacity-100 pointer-events-auto">
        <!-- Title & Text Description -->
        <div class="flex flex-col items-start max-w-lg lg:max-w-xl">
            <h1 class="blocky-text text-2xl sm:text-4xl md:text-5xl lg:text-6xl tracking-wider leading-none select-none drop-shadow-2xl whitespace-nowrap">
                ANGRY K33PERS
            </h1>
            <p class="small-custom-text mt-4 text-white/90 text-sm sm:text-base md:text-lg font-medium drop-shadow-md leading-relaxed">
                We have a hundred links. We are links helpers
            </p>
        </div>

        <!-- Character Display Canvas -->
        <div class="w-[42vw] max-w-[480px] max-h-[70vh] aspect-square flex items-center justify-center pointer-events-none">
            <canvas id="char-canvas" class="w-full h-full object-contain"></canvas>
        </div>
    </main>

    <!-- FULL-SCREEN MENU VIEW -->
    <section id="menu-view" class="hidden min-h-screen w-full relative z-20 flex-col items-center justify-start pt-32 pb-16 px-4 sm:px-8 md:px-12 opacity-0 transition-opacity duration-300 pointer-events-auto">
        
        <!-- Top Middle Header Title -->
        <div class="w-full text-center mb-8">
            <h1 id="menu-title" class="blocky-text text-3xl sm:text-5xl md:text-6xl tracking-wider uppercase drop-shadow-2xl transition-all duration-300">
       GAMES HUB   </h1>
        </div>

        <!-- Grid of Rectangular Boxes -->
        <div class="w-full max-w-6xl">
            <div id="menu-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </div>
    </section>

    <!-- BOX LINKS GUI VIEW -->
    <section id="detail-view" class="hidden min-h-screen w-full relative z-20 flex-col items-center justify-center pt-28 pb-16 px-4 sm:px-8 md:px-12 opacity-0 transition-opacity duration-300 pointer-events-auto">
        
        <!-- Box Name Header in Middle -->
        <h1 id="detail-title" class="blocky-text text-3xl sm:text-5xl md:text-6xl tracking-wider uppercase drop-shadow-2xl text-center mb-10">
            BOX NAME
        </h1>

        <!-- Plain Centered Raw URL Links -->
        <div id="detail-links-container" class="flex flex-col items-center justify-center gap-5 text-center max-w-3xl w-full">
            <!-- Dynamically populated full URL links -->
        </div>
    </section>

    <!-- JavaScript Navigation & Category-Specific Data Configuration -->
    <script>
        const categoryData = {
            "GAMES HUB": [
                {
                    title: "kiwissss",
                    image: "https://github.com/school-rgb/Angrykeepers/blob/main/proxys%20images/Screenshot%202026-10-02%2010.55.51%20PM.png?raw=true",
                    links: [
                        "https://kahoot.si/",
                        "https://srtgarage.net",
                        "https://studyingsmart.uk",
                        "https://smartstudies.cc",
                        "https://classwork.lol"
                    ]
                },
                {
                    title: "frutiger",
                    image: "https://github.com/school-rgb/Angrykeepers/blob/main/proxys%20images/Screenshot%202026-10-02%2011.24.53%20PM.png?raw=true",
                    links: [
                        "https://frutiger-os-v2-5.pages.dev"
                    ]
                }
            ],
            " LINKS": [
                {
                    title: "soloaros",
                    image: "https://github.com/school-rgb/Angrykeepers/blob/main/proxys%20images/Screenshot%202026-10-02%2011.24.09%20PM.png?raw=true",
                    links: [
                        "https://solaraos.lol"
                    ]
                },
                {
                    title: "Tung",
                    image: "https://github.com/school-rgb/Angrykeepers/blob/main/proxys%20images/Screenshot%202026-10-02%2011.25.05%20PM.png?raw=true",
                    links: [
                        "https://tung.sendreward.com"
                    ]
                }
             
            ]
        };

        let currentCategory = "UNBL0CKER HUB";

        /* Render Menu Items Grid for Active Category */
        function renderMenuItems(categoryName) {
            currentCategory = categoryName || "UNBLOCKER HUB";
            const container = document.getElementById('menu-grid');
            if (!container) return;

            const items = categoryData[currentCategory] || categoryData["UNBLOCKER HUB"];

            container.innerHTML = items.map((item, index) => `
                <button onclick="openDetailGUI(${index})" class="group flex flex-col items-center justify-between bg-zinc-900/80 hover:bg-zinc-800/90 border-2 border-zinc-700/80 hover:border-red-500 rounded-xl p-2.5 backdrop-blur-md transition-all transform hover:-translate-y-1 shadow-lg hover:shadow-red-500/20 cursor-pointer aspect-[4/3] w-full">
                    <div class="w-full h-[78%] bg-zinc-950/80 rounded-lg border border-zinc-700/60 overflow-hidden group-hover:border-red-400">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover filter drop-shadow">
                    </div>
                    <span class="small-custom-text text-white text-xs sm:text-sm font-bold tracking-wide text-center line-clamp-1 group-hover:text-red-400 mt-1">
                        ${item.title}
                    </span>
                </button>
            `).join('');
        }

        /* Open Detail View to show raw full URL strings */
        function openDetailGUI(index) {
            const items = categoryData[currentCategory] || categoryData["UNBLOCKER HUB"];
            const item = items[index];
            if (!item) return;

            const menuView = document.getElementById('menu-view');
            const detailView = document.getElementById('detail-view');

            document.getElementById('detail-title').textContent = item.title;

            const linksContainer = document.getElementById('detail-links-container');
            linksContainer.innerHTML = item.links.map(url => `
                <a href="${url}" target="_blank" class="small-custom-text text-white hover:text-red-500 text-base sm:text-2xl font-bold tracking-wide transition-colors duration-200 drop-shadow-lg underline decoration-red-600/60 hover:decoration-red-500 cursor-pointer break-all">
                    ${url}
                </a>
            `).join('');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            menuView.classList.remove('opacity-100');
            menuView.classList.add('opacity-0');

            setTimeout(() => {
                menuView.classList.add('hidden');
                menuView.classList.remove('flex');

                detailView.classList.remove('hidden');
                detailView.classList.add('flex');
                setTimeout(() => {
                    detailView.classList.remove('opacity-0');
                    detailView.classList.add('opacity-100');
                }, 10);
            }, 300);
        }

        /* Home Canvas Background Processing */
        const canvas = document.getElementById('char-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const charUrl = "https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/2963f7ee-bab7-4281-8575-56b95ce9d6e0__1_-removebg-preview.png";

        const thresholdVal = 238;
        const featherVal = 1;

        function loadAndProcessImage() {
            let img = new Image();
            img.crossOrigin = "anonymous";

            img.onload = () => {
                canvas.width = img.naturalWidth || 600;
                canvas.height = img.naturalHeight || 600;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                try {
                    processOuterFloodFill();
                } catch (e) {
                    console.error("Flood fill processing skipped due to canvas restrictions:", e);
                }
            };

            img.onerror = () => {
                console.error("Failed to load character image.");
            };

            img.src = charUrl;
        }

        function processOuterFloodFill() {
            const w = canvas.width;
            const h = canvas.height;
            if (w === 0 || h === 0) return;

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0;
            let tail = 0;

            function isOuterWhiteBackground(idx) {
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const a = data[idx + 3];

                if (a < 15) return true;
                return (r >= thresholdVal && g >= thresholdVal && b >= thresholdVal);
            }

            for (let x = 0; x < w; x++) {
                let topPos = 0 * w + x;
                if (isOuterWhiteBackground(topPos * 4)) {
                    visited[topPos] = 1;
                    queue[tail++] = topPos;
                }
                let botPos = (h - 1) * w + x;
                if (isOuterWhiteBackground(botPos * 4)) {
                    visited[botPos] = 1;
                    queue[tail++] = botPos;
                }
            }

            for (let y = 0; y < h; y++) {
                let leftPos = y * w + 0;
                if (!visited[leftPos] && isOuterWhiteBackground(leftPos * 4)) {
                    visited[leftPos] = 1;
                    queue[tail++] = leftPos;
                }
                let rightPos = y * w + (w - 1);
                if (!visited[rightPos] && isOuterWhiteBackground(rightPos * 4)) {
                    visited[rightPos] = 1;
                    queue[tail++] = rightPos;
                }
            }

            while (head < tail) {
                const pos = queue[head++];
                const cx = pos % w;
                const cy = Math.floor(pos / w);

                data[pos * 4 + 3] = 0;

                const neighbors = [
                    [cx + 1, cy],
                    [cx - 1, cy],
                    [cx, cy + 1],
                    [cx, cy - 1]
                ];

                for (let i = 0; i < 4; i++) {
                    const nx = neighbors[i][0];
                    const ny = neighbors[i][1];

                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const nPos = ny * w + nx;
                        if (!visited[nPos]) {
                            visited[nPos] = 1;
                            if (isOuterWhiteBackground(nPos * 4)) {
                                queue[tail++] = nPos;
                            }
                        }
                    }
                }
            }

            if (featherVal > 0) {
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const pos = y * w + x;
                        const idx = pos * 4;
                        if (data[idx + 3] > 0 && !visited[pos]) {
                            if (visited[pos - 1] || visited[pos + 1] || visited[pos - w] || visited[pos + w]) {
                                data[idx + 3] = Math.floor(data[idx + 3] * 0.4);
                            }
                        }
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        /* View Navigation */
        function showHomeView() {
            const homeView = document.getElementById('home-view');
            const menuView = document.getElementById('menu-view');
            const detailView = document.getElementById('detail-view');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            menuView.classList.remove('opacity-100');
            menuView.classList.add('opacity-0');
            detailView.classList.remove('opacity-100');
            detailView.classList.add('opacity-0');

            setTimeout(() => {
                menuView.classList.add('hidden');
                menuView.classList.remove('flex');
                detailView.classList.add('hidden');
                detailView.classList.remove('flex');

                homeView.classList.remove('hidden');
                homeView.classList.add('flex');
                setTimeout(() => {
                    homeView.classList.remove('opacity-0');
                    homeView.classList.add('opacity-100');
                }, 10);
            }, 300);
        }

        function openMenu(categoryTitle) {
            const homeView = document.getElementById('home-view');
            const menuView = document.getElementById('menu-view');
            const detailView = document.getElementById('detail-view');

            const formattedCategory = categoryTitle ? categoryTitle.toUpperCase() : 'UNBLOCKER HUB';

            document.getElementById('menu-title').textContent = formattedCategory;
            renderMenuItems(formattedCategory);

            window.scrollTo({ top: 0, behavior: 'smooth' });

            homeView.classList.remove('opacity-100');
            homeView.classList.add('opacity-0');
            detailView.classList.remove('opacity-100');
            detailView.classList.add('opacity-0');

            setTimeout(() => {
                homeView.classList.add('hidden');
                homeView.classList.remove('flex');
                detailView.classList.add('hidden');
                detailView.classList.remove('flex');

                menuView.classList.remove('hidden');
                menuView.classList.add('flex');
                setTimeout(() => {
                    menuView.classList.remove('opacity-0');
                    menuView.classList.add('opacity-100');
                }, 10);
            }, 300);
        }

        window.onload = () => {
            renderMenuItems('UNBLOCKER HUB');
            loadAndProcessImage();
        };
    </script>
</body>
</html>
