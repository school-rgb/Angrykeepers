
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGRY KEEPERS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AngryKeepersHugeFont';
            /* Primary OTF font family for huge titles */
            src: url('batsy-bounce.regular.otf') format('opentype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/batsy-bounce.regular.otf') format('opentype'),
                 url('velocita.personal-use.otf') format('opentype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/velocita.personal-use.otf') format('opentype'),
                 url('squares-bold.regular.otf') format('opentype'),
                 url('dedicool.regular.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'AngryKeepersSmallFont';
            /* Primary TTF font family for small body text */
            src: url('gnf.regular.ttf') format('truetype'),
                 url('https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/gnf.regular.ttf') format('truetype'),
                 url('gnf.regular.otf') format('opentype'),
                 url('dedicool.regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        .blocky-text {
            font-family: 'AngryKeepersHugeFont', 'Rubik Mono One', 'Impact', cursive, sans-serif;
            color: #ffffff;
            text-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
        }

        .small-custom-text {
            font-family: 'AngryKeepersSmallFont', sans-serif;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-black select-none font-sans">

    <!-- Fullscreen Background Image -->
    <img id="bg-img" 
         src="https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/5819c412-68d6-4491-b872-0a52c97a3ef9.jpeg" 
         alt="Background" 
         class="absolute inset-0 w-full h-full object-cover z-0">

    <!-- Main Content Container (Vertically Centered, Top-Aligned Items) -->
    <div class="absolute inset-x-6 sm:inset-x-12 md:inset-x-16 lg:inset-x-24 top-1/2 -translate-y-1/2 z-20 flex flex-row items-start justify-between pointer-events-none">
        <!-- Left Side Section: ANGRY KEEPERS Title top-aligned with PNG -->
        <div class="flex flex-col items-start max-w-lg lg:max-w-xl pointer-events-auto pt-[19px]">
            <h1 class="blocky-text text-2xl sm:text-4xl md:text-5xl lg:text-6xl tracking-wider leading-none select-none drop-shadow-2xl whitespace-nowrap">
                ANGRY KEEPERS
            </h1>
            <p class="small-custom-text mt-4 text-white/90 text-sm sm:text-base md:text-lg font-medium drop-shadow-md leading-relaxed">
                We have a hundred proxy links. We're the biggest proxy link website out there.
            </p>
        </div>

        <!-- Character Display Canvas (Middle Right) -->
        <div class="w-[42vw] max-w-[480px] max-h-[70vh] aspect-square flex items-center justify-center pointer-events-none">
            <canvas id="char-canvas" class="w-full h-full object-contain"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('char-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const charUrl = "https://raw.githubusercontent.com/school-rgb/Angrykeepers/main/2963f7ee-bab7-4281-8575-56b95ce9d6e0__1_-removebg-preview.png";

        // Fixed processing parameters
        const thresholdVal = 238;
        const featherVal = 1;

        // Load image securely via blob to bypass CORS restrictions
        async function loadAndProcessImage() {
            let img = new Image();
            img.crossOrigin = "Anonymous";

            try {
                const response = await fetch(charUrl);
                const blob = await response.blob();
                const objectURL = URL.createObjectURL(blob);
                img.src = objectURL;
            } catch (err) {
                // Fallback to direct URL if fetch fails
                img.src = charUrl;
            }

            img.onload = () => {
                canvas.width = img.naturalWidth || 600;
                canvas.height = img.naturalHeight || 600;

                // Draw initial image
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                // Run edge-connected flood fill automatically
                processOuterFloodFill();
            };
        }

        function processOuterFloodFill() {
            const w = canvas.width;
            const h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0;
            let tail = 0;

            // Helper to check if a pixel is outer background white/bright
            function isBackgroundPixel(idx) {
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const a = data[idx + 3];

                if (a < 15) return true; // Already transparent
                return (r >= thresholdVal && g >= thresholdVal && b >= thresholdVal);
            }

            // Seed BFS queue with top, bottom, left, and right borders
            for (let x = 0; x < w; x++) {
                // Top edge
                let idxTop = (0 * w + x) * 4;
                if (isBackgroundPixel(idxTop)) {
                    visited[0 * w + x] = 1;
                    queue[tail++] = 0 * w + x;
                }
                // Bottom edge
                let idxBot = ((h - 1) * w + x) * 4;
                if (isBackgroundPixel(idxBot)) {
                    visited[(h - 1) * w + x] = 1;
                    queue[tail++] = (h - 1) * w + x;
                }
            }

            for (let y = 0; y < h; y++) {
                // Left edge
                let idxLeft = (y * w + 0) * 4;
                if (!visited[y * w + 0] && isBackgroundPixel(idxLeft)) {
                    visited[y * w + 0] = 1;
                    queue[tail++] = y * w + 0;
                }
                // Right edge
                let idxRight = (y * w + (w - 1)) * 4;
                if (!visited[y * w + (w - 1)] && isBackgroundPixel(idxRight)) {
                    visited[y * w + (w - 1)] = 1;
                    queue[tail++] = y * w + (w - 1);
                }
            }

            // Breadth-First Search (BFS) starting strictly from outer edges
            while (head < tail) {
                const pos = queue[head++];
                const cx = pos % w;
                const cy = Math.floor(pos / w);

                // Mark pixel as transparent
                const pixelIdx = pos * 4;
                data[pixelIdx + 3] = 0;

                // Check 4 adjacent neighbors
                const neighbors = [
                    [cx + 1, cy],
                    [cx - 1, cy],
                    [cx, cy + 1],
                    [cx, cy - 1]
                ];

                for (let i = 0; i < 4; i++) {
                    const nx = neighbors[i][0];
                    const ny = neighbors[i][1];

                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const nPos = ny * w + nx;
                        if (!visited[nPos]) {
                            visited[nPos] = 1;
                            const nIdx = nPos * 4;
                            if (isBackgroundPixel(nIdx)) {
                                queue[tail++] = nPos;
                            }
                        }
                    }
                }
            }

            // Optional subtle edge feathering for smooth anti-aliasing
            if (featherVal > 0) {
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const pos = y * w + x;
                        const idx = pos * 4;
                        if (data[idx + 3] > 0 && !visited[pos]) {
                            // Check if adjacent to an erased background pixel
                            if (visited[pos - 1] || visited[pos + 1] || visited[pos - w] || visited[pos + w]) {
                                data[idx + 3] = Math.floor(data[idx + 3] * 0.4);
                            }
                        }
                    }
                }
            }

            // Update canvas with cleaned pixel data
            ctx.putImageData(imgData, 0, 0);
        }

        function copyShareLink() {
            try {
                const dummy = document.createElement('textarea');
                dummy.value = window.location.href;
                dummy.style.position = 'fixed';
                dummy.style.opacity = '0';
                document.body.appendChild(dummy);
                dummy.focus();
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
            } catch (err) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(window.location.href);
                }
            }

            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');
                setTimeout(() => {
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2500);
            }
        }

        // Initialize on page load
        window.onload = loadAndProcessImage;
    </script>
</body>
</html>
